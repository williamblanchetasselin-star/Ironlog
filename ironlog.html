<title>IronLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1c1c1c;
  --border: #262626;
  --text: #f5f5f5;
  --text-dim: #999;
  --text-faint: #555;
  --accent: #ff5722;
  --accent-2: #ff8a50;
  --green: #22c55e;
  --safe-top: env(safe-area-inset-top);
  --safe-bot: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }

#root { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

.app {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-top: var(--safe-top);
}

.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px 100px;
}

.screen::-webkit-scrollbar { display: none; }

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
}
.header h1 .accent { color: var(--accent); }
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text);
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.15s;
}

// ============ ONBOARDING ============
function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [data, setData] = useState({
    name: '', age: '', weight: '', weightUnit: 'kg', height: '', heightUnit: 'cm',
    gender: '', experience: '', goal: '', frequency: '', sports: []
  });

  const update = (k, v) => setData({ ...data, [k]: v });
  const toggleSport = (s) => {
    const has = data.sports.includes(s);
    update('sports', has ? data.sports.filter(x => x !== s) : [...data.sports, s]);
  };

  const steps = [
    { title: 'Welcome', subtitle: "Let's set up your profile" },
    { title: 'Body Stats', subtitle: 'Helps personalize your training' },
    { title: 'Experience', subtitle: 'How long have you been lifting?' },
    { title: 'Your Goal', subtitle: "What are you training for?" },
    { title: 'Frequency', subtitle: 'How many days per week?' },
    { title: 'Sports', subtitle: 'What sports do you play? (optional)' }
  ];

  const canNext = () => {
    if (step === 0) return data.name.trim();
    if (step === 1) return data.age && data.weight && data.height && data.gender;
    if (step === 2) return data.experience;
    if (step === 3) return data.goal;
    if (step === 4) return data.frequency;
    return true;
  };

  const next = () => {
    if (step < steps.length - 1) setStep(step + 1);
    else { storage.set('profile', data); onComplete(data); }
  };

  return h('div', { className: 'onboard' },
    h('div', { className: 'onboard-progress' },
      steps.map((_, i) => h('div', { key: i, className: 'onboard-progress-bar' + (i <= step ? ' active' : '') }))
    ),
    h('h2', null, steps[step].title.toUpperCase()),
    h('p', null, steps[step].subtitle),

    step === 0 && h('div', { className: 'field' },
      h('label', { className: 'label' }, 'Your name'),
      h('input', { className: 'input', value: data.name, onChange: e => update('name', e.target.value), placeholder: 'e.g. Alex', autoFocus: true })
    ),

    step === 1 && h('div', null,
      h('div', { className: 'field' },
        h('label', { className: 'label' }, 'Gender'),
        h('div', { className: 'chips' },
          ['Male', 'Female', 'Other'].map(g =>
            h('div', { key: g, className: 'chip' + (data.gender === g ? ' selected' : ''), onClick: () => update('gender', g) }, g)
          )
        )
      ),
      h('div', { className: 'field' },
        h('label', { className: 'label' }, 'Age'),
        h('input', { className: 'input', type: 'number', value: data.age, onChange: e => update('age', e.target.value), placeholder: '25' })
      ),
      h('div', { className: 'field' },
        h('label', { className: 'label' }, 'Weight'),
        h('div', { style: { display: 'flex', gap: 8 } },
          h('input', { className: 'input', type: 'number', value: data.weight, onChange: e => update('weight', e.target.value), placeholder: '75', style: { flex: 1 } }),
          h('div', { className: 'chips' },
            ['kg', 'lb'].map(u =>
              h('div', { key: u, className: 'chip' + (data.weightUnit === u ? ' selected' : ''), onClick: () => update('weightUnit', u) }, u)
            )
          )
        )
      ),
      h('div', { className: 'field' },
        h('label', { className: 'label' }, 'Height'),
        h('div', { style: { display: 'flex', gap: 8 } },
          h('input', { className: 'input', type: 'number', value: data.height, onChange: e => update('height', e.target.value), placeholder: '175', style: { flex: 1 } }),
          h('div', { className: 'chips' },
            ['cm', 'in'].map(u =>
              h('div', { key: u, className: 'chip' + (data.heightUnit === u ? ' selected' : ''), onClick: () => update('heightUnit', u) }, u)
            )
          )
        )
      )
    ),

    step === 2 && h('div', { className: 'chips', style: { flexDirection: 'column' } },
      ['Beginner (<6 months)', 'Intermediate (6mo–2yr)', 'Advanced (2yr+)'].map(e =>
        h('div', { key: e, className: 'chip' + (data.experience === e ? ' selected' : ''), onClick: () => update('experience', e), style: { width: '100%', textAlign: 'center', padding: '16px' } }, e)
      )
    ),

    step === 3 && h('div', { className: 'chips', style: { flexDirection: 'column' } },
      ['Build muscle (hypertrophy)', 'Get stronger (strength)', 'Lose fat', 'General fitness', 'Sport performance'].map(g =>
        h('div', { key: g, className: 'chip' + (data.goal === g ? ' selected' : ''), onClick: () => update('goal', g), style: { width: '100%', textAlign: 'center', padding: '16px' } }, g)
      )
    ),

    step === 4 && h('div', { className: 'chips' },
      ['2x', '3x', '4x', '5x', '6x'].map(f =>
        h('div', { key: f, className: 'chip' + (data.frequency === f ? ' selected' : ''), onClick: () => update('frequency', f), style: { flex: 1, textAlign: 'center', padding: '20px' } }, f)
      )
    ),

    step === 5 && h('div', { className: 'chips' },
      ['Hockey', 'Soccer', 'Running', 'Cycling', 'Basketball', 'MMA', 'Climbing', 'Tennis', 'Swimming', 'Other'].map(s =>
        h('div', { key: s, className: 'chip' + (data.sports.includes(s) ? ' selected' : ''), onClick: () => toggleSport(s) }, s)
      )
    ),

    h('div', { className: 'onboard-footer' },
      h('button', { className: 'btn', disabled: !canNext(), style: { opacity: canNext() ? 1 : 0.4 }, onClick: () => canNext() && next() },
        step === steps.length - 1 ? "Let's Go" : 'Continue'
      ),
      step > 0 && h('button', { className: 'btn btn-ghost', style: { marginTop: 8 }, onClick: () => setStep(step - 1) }, 'Back')
    )
  );
}

// ============ EXERCISE PICKER MODAL ============
function ExercisePicker({ onPick, onClose, customExercises = [] }) {
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('All');
  const [selected, setSelected] = useState([]);

  const allExercises = [...EXERCISES, ...customExercises];
  const filtered = allExercises.filter(e =>
    (filter === 'All' || e.muscle === filter) &&
    e.name.toLowerCase().includes(search.toLowerCase())
  );

  const toggle = (id) => setSelected(selected.includes(id) ? selected.filter(s => s !== id) : [...selected, id]);

  const confirm = () => {
    const exs = selected.map(id => allExercises.find(e => e.id === id));
    onPick(exs);
  };

  return h('div', { className: 'modal-backdrop', onClick: onClose },
    h('div', { className: 'modal', onClick: e => e.stopPropagation() },
      h('div', { className: 'modal-handle' }),
      h('div', { className: 'modal-title' }, 'ADD EXERCISES'),
      h('div', { className: 'field', style: { marginBottom: 8 } },
        h('input', { className: 'input', placeholder: 'Search exercises...', value: search, onChange: e => setSearch(e.target.value) })
      ),
      h('div', { className: 'chips', style: { marginBottom: 12, overflowX: 'auto', flexWrap: 'nowrap' } },
        MUSCLE_GROUPS.map(m =>
          h('div', { key: m, className: 'chip' + (filter === m ? ' selected' : ''), onClick: () => setFilter(m), style: { flexShrink: 0 } }, m)
        )
      ),
      h('div', { className: 'modal-body' },
        filtered.map(ex =>
          h('div', { key: ex.id, className: 'picker-item' + (selected.includes(ex.id) ? ' selected' : ''), onClick: () => toggle(ex.id) },
            h('div', { className: 'picker-img' }, ex.emoji),
            h('div', { className: 'picker-info' },
              h('div', { className: 'picker-name' }, ex.name),
              h('div', { className: 'picker-muscle' }, ex.muscle + ' · ' + ex.type)
            ),
            selected.includes(ex.id) && h('div', { style: { color: 'var(--accent)' } }, h(Icon, { name: 'check' }))
          )
        )

      h('button', { className: 'btn', style: { marginTop: 12 }, disabled: selected.length === 0, onClick: confirm },
        selected.length > 0 ? `Add ${selected.length} exercise${selected.length > 1 ? 's' : ''}` : 'Select exercises'
      )
    )
  );
}

// ============ ACTIVE WORKOUT ============
function ActiveWorkout({ workout, onUpdate, onFinish, onCancel, settings, startTimer }) {
  const [showPicker, setShowPicker] = useState(false);
  const [swapIdx, setSwapIdx] = useState(null);

  const exercises = workout.exercises || [];

  const updateSet = (exIdx, setIdx, field, value) => {
    const newEx = [...exercises];
    newEx[exIdx].sets[setIdx][field] = value;
    onUpdate({ ...workout, exercises: newEx });
  };

  const toggleSetDone = (exIdx, setIdx) => {
    const newEx = [...exercises];
    const wasDone = newEx[exIdx].sets[setIdx].done;
    newEx[exIdx].sets[setIdx].done = !wasDone;
    onUpdate({ ...workout, exercises: newEx });
    if (!wasDone) {
      // Just marked done — start timer
      startTimer();
      vibrate(50);
    }
  };

  const addSet = (exIdx) => {
    const newEx = [...exercises];
    const lastSet = newEx[exIdx].sets[newEx[exIdx].sets.length - 1];
    newEx[exIdx].sets.push({ weight: lastSet?.weight || '', reps: lastSet?.reps || '', done: false });
    onUpdate({ ...workout, exercises: newEx });
  };

  const removeSet = (exIdx, setIdx) => {
    const newEx = [...exercises];
    newEx[exIdx].sets.splice(setIdx, 1);
    if (newEx[exIdx].sets.length === 0) newEx[exIdx].sets.push({ weight: '', reps: '', done: false });
    onUpdate({ ...workout, exercises: newEx });
  };

  const removeExercise = (exIdx) => {
    const newEx = [...exercises];
    newEx.splice(exIdx, 1);
    onUpdate({ ...workout, exercises: newEx });
  };

  const addExercises = (exs) => {
    if (swapIdx !== null) {
      const newEx = [...exercises];
      newEx[swapIdx] = { ...exs[0], sets: newEx[swapIdx].sets };
      onUpdate({ ...workout, exercises: newEx });
      setSwapIdx(null);
    } else {
      const newEx = [...exercises, ...exs.map(e => ({ ...e, sets: [{ weight: '', reps: '', done: false }] }))];
      onUpdate({ ...workout, exercises: newEx });
    }
    setShowPicker(false);
  };

  return h('div', null,
    exercises.length === 0 && h('div', { className: 'empty' },
      h('div', { className: 'empty-icon' }, '💪'),
      h('div', null, 'No exercises yet'),
      h('div', { style: { fontSize: 13, marginTop: 4 } }, 'Tap below to add some')
    ),

    exercises.map((ex, exIdx) =>
      h('div', { key: exIdx, className: 'exercise-card' },
        h('div', { className: 'exercise-header' },
          h('div', { className: 'exercise-img' }, ex.emoji),
          h('div', { className: 'exercise-info' },
            h('div', { className: 'exercise-name' }, ex.name),
            h('div', { className: 'exercise-meta' }, `${ex.muscle} · ${ex.sets.filter(s => s.done).length}/${ex.sets.length} sets`)
          ),
          h('button', { className: 'icon-btn', onClick: () => removeExercise(exIdx) },
            h(Icon, { name: 'trash' })
          )
        ),
        h('div', { className: 'sets-table' },
          h('div', { className: 'set-header' },
            h('div', null, '#'),
            h('div', null, settings.weightUnit),
            h('div', null, 'Reps'),
            h('div', null, ''),
            h('div', null, '')
          ),
          ex.sets.map((set, setIdx) =>
            h('div', { key: setIdx, className: 'set-row' },
              h('div', { className: 'set-num' }, setIdx + 1),
              h('input', {
                className: 'set-input',
                type: 'number',
                inputMode: 'decimal',
                placeholder: '–',
                value: set.weight,
                onChange: e => updateSet(exIdx, setIdx, 'weight', e.target.value)
              }),
              h('input', {
                className: 'set-input',
                type: 'number',
                inputMode: 'numeric',
                placeholder: '–',
                value: set.reps,
                onChange: e => updateSet(exIdx, setIdx, 'reps', e.target.value)
              }),
              h('div', {
                className: 'set-done' + (set.done ? ' done' : ''),
                onClick: () => toggleSetDone(exIdx, setIdx)
              }, h(Icon, { name: 'check' })),
              h('button', { className: 'set-delete', onClick: () => removeSet(exIdx, setIdx) }, '×')
            )
          )
        ),
        h('div', { className: 'exercise-actions' },
          h('button', { className: 'btn btn-secondary btn-sm', onClick: () => addSet(exIdx) }, '+ Set'),
          h('button', { className: 'btn btn-secondary btn-sm', onClick: () => { setSwapIdx(exIdx); setShowPicker(true); } }, 'Swap')
        )
      )
    ),

    h('button', { className: 'btn btn-secondary', style: { marginTop: 8 }, onClick: () => { setSwapIdx(null); setShowPicker(true); } }, '+ Add Exercise'),

    exercises.length > 0 && h('button', { className: 'btn', style: { marginTop: 8, background: 'var(--green)' }, onClick: onFinish }, 'Finish Workout'),

    h('button', { className: 'btn btn-danger', style: { marginTop: 8 }, onClick: () => { if (confirm('Cancel this workout? Progress will be lost.')) onCancel(); } }, 'Cancel Workout'),

    showPicker && h(ExercisePicker, {
      onPick: addExercises,
      onClose: () => { setShowPicker(false); setSwapIdx(null); }
    })
  );
}

// ============ TIMER BAR ============
function TimerBar({ remaining, onSkip, onAddTime }) {
  if (remaining === null) return null;
  const min = Math.floor(remaining / 60);
  const sec = remaining % 60;
  return h('div', { className: 'timer-bar' },
    h('div', null, `${min}:${sec.toString().padStart(2, '0')}`),
    h('div', { style: { display: 'flex', gap: 8 } },
      h('button', { onClick: onAddTime, title: '+15s' }, '+15'),
      h('button', { onClick: onSkip, title: 'Skip' }, '✕')
    )
  );
}

// ============ PROGRESS SCREEN ============
function ProgressScreen({ history, profile }) {
  const totalWorkouts = history.length;
  const totalVolume = history.reduce((sum, w) => {
    return sum + w.exercises.reduce((s, ex) => {
      return s + ex.sets.filter(set => set.done).reduce((ss, set) => ss + (parseFloat(set.weight) || 0) * (parseInt(set.reps) || 0), 0);
    }, 0);
  }, 0);

  const thisWeek = history.filter(w => {
    const d = new Date(w.date);
    const now = new Date();
    return (now - d) < 7 * 24 * 60 * 60 * 1000;
  }).length;

  const personalRecords = useMemo(() => {
    const prs = {};
    history.forEach(w => {
      w.exercises.forEach(ex => {
        ex.sets.filter(s => s.done).forEach(s => {
          const wt = parseFloat(s.weight) || 0;
          if (!prs[ex.name] || prs[ex.name] < wt) prs[ex.name] = wt;
        });
      });
    });
    return Object.entries(prs).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [history]);

  return h('div', null,
    h('div', { className: 'stat-grid' },
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Total Workouts'),
        h('div', { className: 'stat-value' }, totalWorkouts)
      ),
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'This Week'),
        h('div', { className: 'stat-value' }, thisWeek)
      ),
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Total Volume'),
        h('div', { className: 'stat-value' }, Math.round(totalVolume).toLocaleString(), h('span', { className: 'stat-unit' }, ' ' + (profile?.weightUnit || 'kg')))
      ),
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Streak'),
        h('div', { className: 'stat-value' }, thisWeek + 'd')
      )
    ),

    personalRecords.length > 0 && h('div', null,
      h('div', { className: 'section-title' }, 'PERSONAL RECORDS'),
      h('div', { className: 'card' },
        personalRecords.map(([name, weight], i) =>
          h('div', { key: i, className: 'history-row' },
            h('div', null,
              h('div', { className: 'history-name' }, name),
              h('div', { className: 'history-date' }, 'Best lift')
            ),
            h('div', { className: 'history-stats' }, `${weight} ${profile?.weightUnit || 'kg'}`)
          )
        )
      )
    ),

    h('div', { className: 'section-title' }, 'HISTORY'),
    history.length === 0 ?
      h('div', { className: 'empty' },
        h('div', { className: 'empty-icon' }, '📊'),
        h('div', null, 'No workouts yet'),
        h('div', { style: { fontSize: 13, marginTop: 4 } }, 'Finish a workout to see progress')
      ) :
      h('div', { className: 'card' },
        history.slice().reverse().slice(0, 20).map((w, i) => {
          const totalSets = w.exercises.reduce((s, e) => s + e.sets.filter(set => set.done).length, 0);
          const vol = w.exercises.reduce((s, e) => s + e.sets.filter(set => set.done).reduce((ss, set) => ss + (parseFloat(set.weight) || 0) * (parseInt(set.reps) || 0), 0), 0);
          return h('div', { key: i, className: 'history-row' },
            h('div', null,
              h('div', { className: 'history-name' }, w.name || 'Workout'),
              h('div', { className: 'history-date' }, new Date(w.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }))
            ),
            h('div', { className: 'history-stats' },
              h('div', null, w.exercises.length + ' exercises'),
              h('div', null, totalSets + ' sets · ' + Math.round(vol) + ' ' + (profile?.weightUnit || 'kg'))
            )
          );
        })
      )
  );
}

            s < 60 ? s + 's' : Math.floor(s/60) + 'm' + (s%60 ? (s%60) + 's' : '')
          )
        )
      ),
      h('div', { className: 'label', style: { marginTop: 16 } }, 'Or custom (seconds)'),
      h('input', {
        className: 'input',
        type: 'number',
        value: settings.restTime,
        onChange: e => onChange({ ...settings, restTime: parseInt(e.target.value) || 60 })
      }),

      h('div', { className: 'toggle-row', style: { marginTop: 16 } },
        h('div', null,
          h('div', { style: { fontWeight: 600 } }, 'Sound when timer ends'),
          h('div', { style: { fontSize: 12, color: 'var(--text-dim)', marginTop: 2 } }, 'Ting alert')
        ),
        h('div', { className: 'toggle' + (settings.sound ? ' on' : ''), onClick: () => onChange({ ...settings, sound: !settings.sound }) })
      ),
      h('div', { className: 'toggle-row' },
        h('div', null,
          h('div', { style: { fontWeight: 600 } }, 'Vibrate'),
          h('div', { style: { fontSize: 12, color: 'var(--text-dim)', marginTop: 2 } }, 'Phone vibration')
        ),
        h('div', { className: 'toggle' + (settings.vibrate ? ' on' : ''), onClick: () => onChange({ ...settings, vibrate: !settings.vibrate }) })
      ),
      h('div', { className: 'toggle-row' },
        h('div', null,
          h('div', { style: { fontWeight: 600 } }, 'Auto-start timer'),
          h('div', { style: { fontSize: 12, color: 'var(--text-dim)', marginTop: 2 } }, 'Starts when set marked done')
        ),
        h('div', { className: 'toggle' + (settings.autoStart ? ' on' : ''), onClick: () => onChange({ ...settings, autoStart: !settings.autoStart }) })
      ),
      h('button', { className: 'btn btn-secondary btn-sm', style: { marginTop: 12 }, onClick: () => { playDing(); vibrate(100); } }, 'Test sound')
    ),

    h('div', { className: 'section-title' }, 'UNITS'),
    h('div', { className: 'card' },
      h('div', { className: 'label' }, 'Weight'),
      h('div', { className: 'chips' },
        ['kg', 'lb'].map(u =>
          h('div', { key: u, className: 'chip' + (settings.weightUnit === u ? ' selected' : ''), onClick: () => onChange({ ...settings, weightUnit: u }) }, u)
        )
      )
    ),

    h('div', { className: 'section-title' }, 'PROFILE'),
    h('div', { className: 'card' },
      profile && h('div', null,
        h('div', { className: 'history-row' }, h('div', null, 'Name'), h('div', null, profile.name)),
        h('div', { className: 'history-row' }, h('div', null, 'Age'), h('div', null, profile.age)),
        h('div', { className: 'history-row' }, h('div', null, 'Weight'), h('div', null, profile.weight + ' ' + profile.weightUnit)),
        h('div', { className: 'history-row' }, h('div', null, 'Height'), h('div', null, profile.height + ' ' + profile.heightUnit)),
        h('div', { className: 'history-row' }, h('div', null, 'Experience'), h('div', null, profile.experience)),
        h('div', { className: 'history-row' }, h('div', null, 'Goal'), h('div', null, profile.goal)),
        h('div', { className: 'history-row' }, h('div', null, 'Frequency'), h('div', null, profile.frequency + '/week')),
        profile.sports?.length > 0 && h('div', { className: 'history-row' }, h('div', null, 'Sports'), h('div', null, profile.sports.join(', ')))
      ),
      h('button', { className: 'btn btn-secondary btn-sm', style: { marginTop: 12 }, onClick: onResetProfile }, 'Edit Profile')
    ),

    h('div', { className: 'section-title' }, 'DATA'),
    h('div', { className: 'card' },
      h('button', { className: 'btn btn-danger', onClick: onClearData }, 'Clear All Data')
    )
  );
}

// ============ HOME SCREEN ============
function Home({ profile, activeWorkout, onStart, onResume, history, settings }) {
  const greet = () => {
    const hr = new Date().getHours();
    if (hr < 12) return 'Good morning';
    if (hr < 18) return 'Good afternoon';
    return 'Good evening';
  };

  const last = history[history.length - 1];

  // Suggest based on goal
  const recommendation = useMemo(() => {
    if (!profile) return null;
    const goal = profile.goal || '';
    if (goal.includes('strength')) return { name: 'Strength Day', ex: ['squat', 'bench-press', 'deadlift', 'ohp'] };
    if (goal.includes('muscle')) return { name: 'Hypertrophy Push', ex: ['bench-press', 'incline-bench', 'ohp', 'lat-raise', 'tricep-pushdown'] };
    if (goal.includes('fat')) return { name: 'Full Body Burn', ex: ['squat', 'bench-press', 'barbell-row', 'ohp', 'plank'] };
    return { name: 'Full Body', ex: ['squat', 'bench-press', 'barbell-row'] };
  }, [profile]);

  return h('div', null,
    h('div', { style: { padding: '20px 0 8px' } },
      h('div', { style: { color: 'var(--text-dim)', fontSize: 13 } }, greet() + ','),
      h('div', { style: { fontFamily: 'Bebas Neue', fontSize: 36, letterSpacing: 2, lineHeight: 1 } }, (profile?.name || 'Lifter').toUpperCase())
    ),

    activeWorkout ?
      h('div', { className: 'card', style: { background: 'linear-gradient(135deg, var(--accent), var(--accent-2))', border: 'none', color: 'white' } },
        h('div', { style: { fontSize: 12, opacity: 0.85, textTransform: 'uppercase', letterSpacing: 1, fontWeight: 700 } }, 'Workout in progress'),
        h('div', { style: { fontFamily: 'Bebas Neue', fontSize: 28, letterSpacing: 1.5, marginTop: 4 } }, (activeWorkout.name || 'Untitled').toUpperCase()),
        h('div', { style: { fontSize: 13, opacity: 0.85, marginTop: 4 } }, (activeWorkout.exercises?.length || 0) + ' exercises'),
        h('button', { className: 'btn', style: { background: 'rgba(0,0,0,0.25)', marginTop: 12 }, onClick: onResume }, 'Resume Workout')
      ) :
      h('button', { className: 'btn', style: { marginTop: 16, padding: '20px' }, onClick: () => onStart() }, '+ Start Empty Workout'),

    !activeWorkout && recommendation && h('div', null,
      h('div', { className: 'section-title' }, 'RECOMMENDED FOR YOU'),
      h('div', { className: 'card' },
        h('div', { style: { fontWeight: 700, fontSize: 16, marginBottom: 4 } }, recommendation.name),
        h('div', { style: { fontSize: 13, color: 'var(--text-dim)', marginBottom: 12 } }, `Based on your goal: ${profile?.goal || ''}`),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 } },
          recommendation.ex.map(id => {
            const ex = EXERCISES.find(e => e.id === id);
            if (!ex) return null;
            return h('div', { key: id, style: { display: 'flex', alignItems: 'center', gap: 10 } },
              h('div', { style: { width: 36, height: 36, borderRadius: 8, background: 'var(--surface-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 } }, ex.emoji),
              h('div', null,
                h('div', { style: { fontWeight: 600, fontSize: 13 } }, ex.name),
                h('div', { style: { fontSize: 11, color: 'var(--text-dim)' } }, ex.muscle)
              )
            );
          })
        ),
        h('button', { className: 'btn btn-secondary', onClick: () => onStart(recommendation) }, 'Start This Workout')
      )
    ),

    last && h('div', null,
      h('div', { className: 'section-title' }, 'LAST WORKOUT'),
      h('div', { className: 'card' },
        h('div', { style: { fontWeight: 700, fontSize: 15 } }, last.name || 'Workout'),
        h('div', { style: { fontSize: 12, color: 'var(--text-dim)', marginTop: 2 } }, new Date(last.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + last.exercises.length + ' exercises')
      )
    )
  );
}

// ============ MAIN APP ============
function App() {
  const [profile, setProfile] = useState(storage.get('profile', null));
  const [tab, setTab] = useState('home');
  const [workout, setWorkout] = useState(storage.get('activeWorkout', null));
  const [history, setHistory] = useState(storage.get('history', []));
  const [settings, setSettings] = useState(storage.get('settings', { restTime: 90, sound: true, vibrate: true, autoStart: true, weightUnit: 'kg' }));
  const [timer, setTimer] = useState(null);
  const [installPrompt, setInstallPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(true);
  const timerRef = useRef(null);

  // Persist
  useEffect(() => { storage.set('activeWorkout', workout); }, [workout]);
  useEffect(() => { storage.set('history', history); }, [history]);
  useEffect(() => { storage.set('settings', settings); }, [settings]);

  // Install prompt
  useEffect(() => {
    const handler = e => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  // Register service worker
  useEffect(() => {
// SW disabled in single-file mode
  }, []);

  // Timer
  useEffect(() => {
    if (timer === null) return;
    if (timer <= 0) {
      if (settings.sound) playDing();
      if (settings.vibrate) vibrate([200, 100, 200]);
      setTimer(null);
      return;
    }
    timerRef.current = setTimeout(() => setTimer(timer - 1), 1000);
    return () => clearTimeout(timerRef.current);
  }, [timer, settings.sound, settings.vibrate]);

  const startTimer = () => {
    if (!settings.autoStart) return;
    setTimer(settings.restTime);
  };

  const startWorkout = (template) => {
    const newWorkout = {
      id: Date.now(),
      date: new Date().toISOString(),
      name: template?.name || 'Workout',
      exercises: template?.ex ? template.ex.map(id => {
        const ex = EXERCISES.find(e => e.id === id);
        return { ...ex, sets: [{ weight: '', reps: '', done: false }, { weight: '', reps: '', done: false }, { weight: '', reps: '', done: false }] };
      }) : []
    };
    setWorkout(newWorkout);
    setTab('workout');
  };

  const finishWorkout = () => {
    if (!workout.exercises.some(e => e.sets.some(s => s.done))) {
      alert('Complete at least one set before finishing.');
      return;
    }
    setHistory([...history, { ...workout, date: new Date().toISOString() }]);
    setWorkout(null);
    setTimer(null);
    setTab('progress');
  };

  const cancelWorkout = () => {
    setWorkout(null);
    setTimer(null);
    setTab('home');
  };

  if (!profile) {
    return h(Onboarding, { onComplete: p => { setProfile(p); setSettings({ ...settings, weightUnit: p.weightUnit }); } });
  }

  const screens = {
    home: h(Home, { profile, activeWorkout: workout, onStart: startWorkout, onResume: () => setTab('workout'), history, settings }),
    workout: workout ?
      h(ActiveWorkout, { workout, onUpdate: setWorkout, onFinish: finishWorkout, onCancel: cancelWorkout, settings, startTimer }) :
      h('div', { style: { padding: '20px 0' } },
        h('div', { className: 'empty' },
          h('div', { className: 'empty-icon' }, '💪'),
          h('div', null, 'No active workout'),
          h('div', { style: { fontSize: 13, marginTop: 4, marginBottom: 16 } }, 'Start one from home')
        ),
        h('button', { className: 'btn', onClick: () => startWorkout() }, '+ Start Empty Workout')
      ),
    progress: h(ProgressScreen, { history, profile }),
    map: h(GymMap, null),
    settings: h(Settings, {
      settings, onChange: setSettings, profile,
      onResetProfile: () => { localStorage.removeItem('profile'); setProfile(null); },
      onClearData: () => {
        if (confirm('Clear all workout history? This cannot be undone.')) {
          setHistory([]); setWorkout(null); setTimer(null);
        }
      }
    }),
  };

  const tabTitle = {
    home: 'IRON·LOG',
    workout: workout?.name?.toUpperCase() || 'WORKOUT',
    progress: 'PROGRESS',
    map: 'GYM MAP',
    settings: 'SETTINGS'
  };

  const installApp = async () => {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      setInstallPrompt(null);
      setShowInstall(false);
    } else {
      alert("To install:\n\niPhone: Tap Share → 'Add to Home Screen'\n\nAndroid: Tap menu (⋮) → 'Install app' or 'Add to Home Screen'");
    }
  };

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

  return h('div', { className: 'app' },
    h('div', { className: 'header' },
      h('h1', null, tab === 'home' ? h(React.Fragment, null, 'IRON', h('span', { className: 'accent' }, '·'), 'LOG') : tabTitle[tab]),
      h('button', { className: 'icon-btn', onClick: () => setTab('settings') }, h(Icon, { name: 'settings' }))
    ),
    h('div', { className: 'screen' },
      !isStandalone && showInstall && tab === 'home' && h('div', { className: 'install-banner' },
        h('div', { style: { fontSize: 20 } }, '📲'),
        h('div', null,
          h('div', { style: { fontWeight: 700 } }, 'Install app'),
          h('div', { style: { opacity: 0.85, fontSize: 11 } }, 'No browser bar, works offline')
        ),
        h('button', { onClick: installApp }, 'Install')
      ),
      screens[tab]
    ),
    h(TimerBar, {
      remaining: timer,
      onSkip: () => setTimer(null),
      onAddTime: () => setTimer(t => (t || 0) + 15)
    }),
    h('div', { className: 'nav' },
      [
        { id: 'home', icon: 'home', label: 'Home' },
        { id: 'workout', icon: 'dumbbell', label: 'Workout' },
        { id: 'progress', icon: 'chart', label: 'Progress' },
        { id: 'map', icon: 'map', label: 'Map' }
      ].map(t =>
        h('button', { key: t.id, className: 'nav-btn' + (tab === t.id ? ' active' : ''), onClick: () => setTab(t.id) },
          h(Icon, { name: t.icon }),
          h('span', null, t.label)
        )
      )
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
